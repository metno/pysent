name: Docs image

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - "tests/data/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pysent-docs

jobs:
  build-and-execute:
    name: build image and execute notebooks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon so the notebooks can be executed below,
      # before anything is published.
      - name: Build the docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/Dockerfile
          tags: pysent-docs:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The point of the exercise: every notebook is executed for real, in the
      # image, against the committed fixtures. A notebook that no longer runs
      # fails the build instead of quietly rotting in the repository.
      - name: Execute notebooks
        run: |
          mkdir -p executed
          status=0
          for nb in docs/notebooks/0*.ipynb; do
            name="$(basename "$nb")"
            echo "::group::$name"
            if docker run --rm \
                 -v "$PWD/executed:/out" \
                 -w /opt/pysent/docs/notebooks \
                 pysent-docs:ci \
                 papermill "$name" "/out/$name" \
                   --kernel python3 \
                   -p OUTPUT_DIR /tmp/nb-output; then
              echo "$name OK"
            else
              echo "::error file=$nb::$name failed to execute"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed/
          if-no-files-found: warn

      # Only publish from main: a pull request proves the notebooks still run,
      # but must not overwrite the image other people are pulling.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both tags are published by a single buildx invocation (a cache hit on the
      # build above, so this is quick). Pushing tags one at a time with plain
      # `docker push` makes GHCR reject the second with "unknown blob", because
      # it re-mounts blobs the registry has not finalised yet.
      - name: Push the image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
