# Every commit a PR adds is authored by an allowed identity and carries no AI attribution
# (CLAUDE.md -> "Commit identity"). A red check is fixed by rewriting your own branch's commits.
name: commit identity

on:
  pull_request:

jobs:
  commit-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check the PR's commits
        run: scripts/check_commit_identity.sh "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
